{
  "name": "Luma Studio Windows Candidate",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "windows-candidate-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "windows": {
      "runs-on": "windows-2022",
      "timeout-minutes": 90,
      "env": {
        "CSC_IDENTITY_AUTO_DISCOVERY": "false"
      },
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22",
            "cache": "npm"
          }
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci"
        },
        {
          "name": "Regression checks",
          "run": "npx tsx --test tests/*.test.ts"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable"
        },
        {
          "name": "Rust regression checks",
          "run": "cargo test --manifest-path src-tauri/Cargo.toml --lib --locked"
        },
        {
          "name": "Build Windows x64 NSIS candidate",
          "run": "npx tauri build --bundles nsis --target x86_64-pc-windows-msvc"
        },
        {
          "name": "Install, launch and uninstall in isolated runner",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -File | Select-Object -First 1\nif (-not $installer) { throw 'Installer missing' }\n$directory = Join-Path $env:RUNNER_TEMP 'luma-install-test'\n$installed = Start-Process $installer.FullName -ArgumentList @('/S',\"/D=$directory\") -PassThru\nif (-not $installed.WaitForExit(120000)) { Stop-Process -Id $installed.Id -Force; throw 'Installer timed out' }\nif ($installed.ExitCode -ne 0) { throw \"Installer failed: $($installed.ExitCode)\" }\n$executables = @(Get-ChildItem $directory -Filter *.exe -File | Where-Object { $_.Name -notmatch 'unins|uninstall|update' })\nif ($executables.Count -ne 1) { throw 'Expected one installed application executable' }\n$executable = $executables[0]\n$process = Start-Process $executable.FullName -WorkingDirectory $directory -PassThru\n$windowOpened = $false\ntry {\n  for ($attempt = 0; $attempt -lt 60; $attempt++) {\n    Start-Sleep -Milliseconds 500\n    $windows = @(Get-Process | Where-Object { $_.Path -eq $executable.FullName -and $_.MainWindowHandle -ne 0 })\n    if ($windows.Count -gt 0) { $windowOpened = $true; break }\n    if ($process.HasExited -and -not (Get-Process | Where-Object { $_.Path -eq $executable.FullName })) { throw 'Installed application exited before opening a window' }\n  }\n  if (-not $windowOpened) { throw 'Installed application did not open a native window' }\n} finally {\n  Get-Process | Where-Object { $_.Path -eq $executable.FullName } | Stop-Process -Force\n}\n$uninstaller = Get-ChildItem $directory -File -Filter '*uninstall*.exe' | Select-Object -First 1\nif (-not $uninstaller) { throw 'Uninstaller missing' }\n$removed = Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru\nif (-not $removed.WaitForExit(120000)) { Stop-Process -Id $removed.Id -Force; throw 'Uninstaller timed out' }\nif ($removed.ExitCode -ne 0) { throw 'Uninstall failed' }\nNew-Item -ItemType Directory -Force windows-evidence | Out-Null\n[ordered]@{ installer=$installer.Name; executable=$executable.Name; installPassed=$true; nativeWindowOpened=$windowOpened; uninstallPassed=$true; realUserWorkflowsQualified=$false; commit=$env:GITHUB_SHA } | ConvertTo-Json | Set-Content windows-evidence/install-smoke.json"
        },
        {
          "name": "Record checksums, source and signing status",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$files = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -File)\nif ($files.Count -eq 0) { throw 'No Windows installer produced' }\nNew-Item -ItemType Directory -Force windows-evidence | Out-Null\n$records = foreach ($file in $files) {\n  $signature = Get-AuthenticodeSignature $file.FullName\n  [ordered]@{ name=$file.Name; bytes=$file.Length; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); authenticode=$signature.Status.ToString() }\n}\n[ordered]@{ product='Luma Studio'; commit=$env:GITHUB_SHA; runner=$env:RUNNER_OS; architecture='x64'; candidate=$true; publicReleaseReady=$false; cleanInstallQualified=$false; saveExportQualified=$false; installers=@($records) } | ConvertTo-Json -Depth 8 | Set-Content windows-evidence/build-receipt.json\n$records | ForEach-Object { \"$($_.sha256)  $($_.name)\" } | Set-Content windows-evidence/SHA256SUMS.txt"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "luma-windows-x64-candidate",
            "path": "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe\nwindows-evidence/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
