name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint app tests --max-warnings 0

      # `npm test` builds first (the rendered-html test needs dist/), so this
      # covers the production build as well as the unit suite.
      - name: Test
        run: npm test

  native-core:
    name: Native core (luma-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/luma-core

      # Parity against the same W3C reference values as the TypeScript suite.
      - name: Test
        run: cargo test --manifest-path crates/luma-core/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path crates/luma-core/Cargo.toml -- -D warnings
