name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint app tests --max-warnings 0

      # `npm test` builds first (the rendered-html test needs dist/), so this
      # covers the primary Cloudflare/vinext build as well as the unit suite.
      - name: Test
        run: npm test

      # The other two targets are real deploy paths that nothing else exercises,
      # so they rot silently. netlify.toml says to keep both working or drop
      # one; this is what "keep working" has to mean.
      - name: Build (Netlify target)
        run: npm run build:netlify

      - name: Build (desktop bundle)
        run: npm run desktop:build

  native-core:
    name: Native core (luma-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/luma-core

      # Parity against the same W3C reference values as the TypeScript suite.
      - name: Test
        run: cargo test --manifest-path crates/luma-core/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path crates/luma-core/Cargo.toml -- -D warnings

  desktop-bridge:
    name: Desktop bridge (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri links against the system webview even for `cargo test`.
      - name: Install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev

      # Covers the binary IPC protocol and the atomic-save path, including the
      # round trip against tests/fixtures/native-tile.bin produced by the
      # TypeScript encoder. Previously CI ran only crates/luma-core, so the
      # entire browser<->Rust bridge was unverified.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # crates/luma-core has been linted since it was added; the Tauri shell
      # never was, and it now carries the menu, the file-open routing and the
      # recent-files store rather than just a window.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
