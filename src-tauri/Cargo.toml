[package]
name = "luma-studio"
version = "0.1.0"
description = "Luma Studio — pro edition"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Enabled by `tauri dev`; keeps devtools out of release builds.
custom-protocol = ["tauri/custom-protocol"]
